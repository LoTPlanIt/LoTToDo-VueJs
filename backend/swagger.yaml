          },
        ]
      tags:
        - "Project board"
      summary: "Get project kanban board task detail"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      title:
                        type: string
                        example: "task title"
                      description:
                        type: string
                        example: "This is a task"
                      assignedTo:
                        type: string
                        example: "username"
                      status:
                        type: string
                        example: "planing"
                      labels:
                        type: string
                        example: "frontend"
                      priority:
