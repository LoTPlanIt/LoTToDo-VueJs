        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Cannot get project kanban board task detail"
    #Update project kanban board task
    put:
      description: "Update a task"
      parameters:
        [
          {
            name: "Authorization",
            in: "header",
            description: "Bearer token",
            required: true,
            schema: { type: "string" },
          },
          {
            name: "projectId",
            in: "path",
            description: "Project ID",
            required: true,
            schema: { type: "string" },
          },
          {
            name: "taskId",
            in: "query",
            description: "Task ID",
            required: true,
            schema: { type: "string" },
          },
        ]
      tags:
        - "Project board"
      summary: "Update a task"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "new task title"
